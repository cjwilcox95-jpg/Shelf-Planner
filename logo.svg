<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Shelf Planner: three shelves of products with a shelf tag, on grocery green -->
  <rect width="100" height="100" rx="22" fill="#1f8a5b"/>
  <g id="art" transform="translate(0 -4)">
    <!-- top shelf -->
    <rect x="18" y="20" width="10" height="16" rx="1.5" fill="#ff9f80"/>
    <rect x="30" y="18" width="12" height="18" rx="1.5" fill="#ffffff"/>
    <rect x="44" y="24" width="9" height="12" rx="1.5" fill="#b8dcff"/>
    <rect x="55" y="20" width="12" height="16" rx="1.5" fill="#fff3c4"/>
    <rect x="69" y="22" width="13" height="14" rx="1.5" fill="#ffffff"/>
    <rect x="16" y="36" width="68" height="4" rx="1" fill="#e9f5ee"/>
    <!-- middle shelf -->
    <rect x="18" y="44" width="14" height="16" rx="1.5" fill="#ffffff"/>
    <rect x="34" y="42" width="10" height="18" rx="1.5" fill="#b8dcff"/>
    <rect x="46" y="47" width="16" height="13" rx="1.5" fill="#ff9f80"/>
    <rect x="64" y="43" width="18" height="17" rx="1.5" fill="#ffffff"/>
    <rect x="16" y="60" width="68" height="4" rx="1" fill="#e9f5ee"/>
    <!-- bottom shelf -->
    <rect x="18" y="67" width="18" height="17" rx="1.5" fill="#fff3c4"/>
    <rect x="38" y="70" width="12" height="14" rx="1.5" fill="#ffffff"/>
    <rect x="52" y="65" width="14" height="19" rx="1.5" fill="#ff9f80"/>
    <rect x="68" y="69" width="14" height="15" rx="1.5" fill="#b8dcff"/>
    <rect x="16" y="84" width="68" height="4" rx="1" fill="#e9f5ee"/>
    <!-- a shelf tag on the front edge -->
    <rect x="20" y="86" width="17" height="9" rx="1.5" fill="#ffffff"/>
    <rect x="23" y="89.5" width="8" height="2.5" rx="1" fill="#1f8a5b"/>
  </g>
</svg>
